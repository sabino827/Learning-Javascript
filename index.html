<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caça-Bugs JS</title>
<meta name="description" content="Jogo para treinar lógica em JavaScript encontrando erros no código.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#f4f5f9;--card:#fff;--fg:#1c2030;--muted:#6a7088;--accent:#5b5bf0;--ok:#1f9d55;--bad:#d64545;--code:#1e2233;--codefg:#e6e9f5;--line:#dfe2ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141d;--card:#1b1e2b;--fg:#eceef7;--muted:#9aa0b8;--accent:#8686ff;--ok:#3ec97a;--bad:#ff6b6b;--code:#0d0f17;--line:#2c3044}}
:root[data-theme="dark"]{--bg:#12141d;--card:#1b1e2b;--fg:#eceef7;--muted:#9aa0b8;--accent:#8686ff;--ok:#3ec97a;--bad:#ff6b6b;--code:#0d0f17;--line:#2c3044}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;margin-bottom:8px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.9rem}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.t-k,.t-o{color:#ff79c6}.t-s{color:#f1fa8c}.t-n{color:#bd93f9}.t-c{color:#6272a4}.t-f{color:#50fa7b}.t-d{color:#8be9fd;font-style:italic}
.tag{font-size:.8rem;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
pre{background:var(--code);color:var(--codefg);border-radius:12px;padding:14px;margin:10px 0 14px;overflow-x:auto;font:.9rem/1.5 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
.q{font-weight:700;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--bg))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--bg))}
.fb{margin-top:14px;padding:12px;border-radius:12px;background:var(--bg);border-left:4px solid var(--accent);display:none}
.fb.show{display:block}
.fb b.ok{color:var(--ok)}.fb b.bad{color:var(--bad)}
.btn{margin-top:12px;font:inherit;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:12px;padding:12px 18px;cursor:pointer;width:100%}
.end{text-align:center}
.big{font-size:3rem;margin:0}
.hide{display:none!important}
.win{border-radius:12px;overflow:hidden;background:var(--code);margin:10px 0 14px}
.wbar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:rgba(255,255,255,.07)}
.wbar i{width:10px;height:10px;border-radius:50%;background:#ff5f56}
.wbar i:nth-child(2){background:#ffbd2e}.wbar i:nth-child(3){background:#27c93f}
.wbar span{margin-left:8px;color:#9aa0b8;font:.8rem "JetBrains Mono",ui-monospace,Menlo,monospace}
.win pre{margin:0;border-radius:0}
code{counter-reset:l}
.ln{display:block;min-height:1.5em;white-space:pre}
.ln::before{counter-increment:l;content:counter(l);display:inline-block;width:2ch;margin-right:1.4ch;color:#5b6180;text-align:right}
.hero{margin-bottom:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tabs{display:flex;gap:6px;margin:14px 0 10px;overflow-x:auto;padding-bottom:4px}
.tab{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.num{font-weight:800;color:var(--accent);min-width:2ch}
.rt{flex:1;display:flex;flex-direction:column}
.rt small{color:var(--muted)}
.chip{font-size:.8rem;border-radius:99px;padding:2px 10px;border:1px solid var(--line);white-space:nowrap}
.chip.done{color:var(--ok);border-color:var(--ok)}.chip.fail{color:var(--bad);border-color:var(--bad)}
.link{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;text-decoration:underline;padding:8px 0}
.lbl{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:10px}
.nav{display:flex;gap:6px;margin:0 0 12px}
.nav .tab{flex:1;text-align:center;font-weight:700}
#ltitle{margin:4px 0 8px}
h1,h2,.tag,.num{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
pre,code,.ln,.wbar span{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:inherit;font-variant-ligatures:contextual}
pre{background:#282a36;color:#f8f8f2}
.win{background:#282a36}
.wbar{background:#21222c}
.wbar span,.ln::before{color:#6272a4}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:var(--accent);margin-right:8px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;margin-top:10px}
.rk{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--card)}
.rk.me{border-color:var(--accent)}
.rk b{flex:1}
.fld{display:block;font-size:.85rem;font-weight:600;margin-top:10px}
.fld input{display:block;width:100%;margin-top:4px;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.fld input:focus{outline:none;border-color:var(--accent)}
.err{color:var(--bad);min-height:1.2em;margin:8px 0 0;font-size:.9rem}
.nav .tab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<main>
  <h1>🐞 Caça-Bugs JS</h1>
  <p class="sub" id="rank"></p>
  <nav class="nav"><button class="tab on" id="nGame">🎮 Jogar</button><button class="tab" id="nLearn">📘 Aprender</button><button class="tab" id="nAcc">👤 Conta</button></nav>

  <section id="board">
    <div class="card hero">
      <div class="bar"><b id="lvl"></b><span class="pill" id="xptxt"></span></div>
      <div class="prog" style="margin-bottom:0"><i id="xpbar"></i></div>
      <div class="stats" id="stats"></div>
      <button class="btn" id="cont"></button>
    </div>
    <div class="tabs" id="ltabs"></div>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
    <button class="link" id="reset">Zerar progresso</button>
  </section>

  <section id="play" class="hide">
    <div class="bar">
      <button class="link" id="back">← Painel</button>
      <span class="pill" id="pinfo"></span>
      <span class="pill" id="streak"></span>
    </div>
    <div class="card">
      <div class="tag" id="tag"></div>
      <div class="win">
        <div class="wbar"><i></i><i></i><i></i><span id="fname"></span></div>
        <pre><code id="code"></code></pre>
      </div>
      <p class="q">Qual é o erro nesse código?</p>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb"></div>
      <button class="btn hide" id="next"></button>
    </div>
  </section>
  <section id="account" class="hide">
    <div class="card" id="acOut">
      <div class="tabs" id="acTabs"><button class="tab on" data-m="in">Entrar</button><button class="tab" data-m="up">Criar conta</button></div>
      <label class="fld">Usuário<input id="fUser" autocomplete="username" maxlength="20" placeholder="ex: ana_dev"></label>
      <label class="fld">Senha<input id="fPass" type="password" autocomplete="current-password" placeholder="mínimo 6 caracteres"></label>
      <label class="fld hide" id="fPass2w">Confirmar senha<input id="fPass2" type="password" autocomplete="new-password"></label>
      <label class="chk hide" id="fMoveW"><input type="checkbox" id="fMove" checked> Copiar meu progresso atual (convidado) para a nova conta</label>
      <p class="err" id="acErr"></p>
      <button class="btn" id="acGo">Entrar</button>
      <p class="sub">A conta fica salva neste aparelho, no navegador. Para usar em outro aparelho, crie outra conta lá.</p>
    </div>
    <div class="card hide" id="acIn">
      <div class="bar"><b id="acName"></b><span class="pill" id="acSt"></span></div>
      <p class="sub" id="acInfo"></p>
      <button class="btn" id="acOutBtn">Sair da conta</button>
      <button class="link" id="acDel">Excluir conta</button>
    </div>
    <h3 id="rkT">🏆 Ranking</h3>
    <div id="rkList"></div>
  </section>

  <section id="learn" class="hide">
    <p class="sub">Aprenda o básico da sintaxe antes de caçar bugs. Cada aula dá +15 XP ao acertar o quiz.</p>
    <div id="llist"></div>
  </section>

  <section id="lesson" class="hide">
    <button class="link" id="lback">← Aulas</button>
    <div class="card">
      <div class="tag" id="ltag"></div>
      <h2 id="ltitle"></h2>
      <p id="ltext"></p>
      <div class="win">
        <div class="wbar"><i></i><i></i><i></i><span id="lfile"></span></div>
        <pre><code id="lcode"></code></pre>
      </div>
      <p class="q" id="lq"></p>
      <div class="opts" id="lopts"></div>
      <div class="fb" id="lfb"></div>
      <button class="btn hide" id="lnext"></button>
    </div>
  </section>
</main>

<script>
const QUESTIONS = [
 {tag:"Funções", code:"function soma(a, b) {\n  a + b;\n}\nconsole.log(soma(2, 3));",
  o:["A função não tem return, então devolve undefined","Falta declarar as variáveis a e b com let","O operador + não funciona com números","console.log não pode receber função"],c:0,
  e:"Sem return, a função executa a soma mas não devolve nada. O resultado impresso é undefined.",f:"return a + b;"},
 {tag:"Condições", code:"let idade = 18;\nif (idade = 18) {\n  console.log(\"Maior de idade\");\n}",
  o:["Falta else no if","Usou = (atribuição) em vez de === (comparação)","idade deveria ser string","if não aceita números"],c:1,
  e:"Com = o valor 18 é atribuído à variável e a condição vira sempre verdadeira. Para comparar, use === .",f:"if (idade === 18) {"},
 {tag:"Laços", code:"const frutas = [\"maçã\", \"uva\", \"pera\"];\nfor (let i = 0; i <= frutas.length; i++) {\n  console.log(frutas[i]);\n}",
  o:["O laço deveria usar var","frutas.length vale 2","A condição <= passa do último índice e imprime undefined","Arrays não podem ser percorridos com for"],c:2,
  e:"Os índices vão de 0 a length - 1. Com <= o laço roda mais uma vez e frutas[3] é undefined.",f:"i < frutas.length"},
 {tag:"Variáveis", code:"const total = 10;\ntotal = total + 5;\nconsole.log(total);",
  o:["total + 5 não é permitido","Falta ponto e vírgula depois de 10","console.log não imprime const","Tentou reatribuir uma constante, o que gera TypeError"],c:3,
  e:"Variáveis const não podem ser reatribuídas. Se o valor muda, use let.",f:"let total = 10;"},
 {tag:"Tipos", code:"let a = \"5\";\nlet b = 3;\nconsole.log(a + b); // esperado: 8",
  o:["O + concatena porque a é string, resultando em \"53\"","b deveria ser string","console.log soma errado","let não permite números"],c:0,
  e:"Quando um dos lados é string, o + concatena. Converta antes: Number(a) + b.",f:"console.log(Number(a) + b);"},
 {tag:"Laços", code:"let i = 0;\nwhile (i < 5) {\n  console.log(i);\n}",
  o:["while não aceita números","i deveria começar em 1","console.log dentro do laço é proibido","i nunca é incrementado, então o laço é infinito"],c:3,
  e:"A condição i < 5 nunca fica falsa porque i não muda. Falta i++ dentro do laço.",f:"console.log(i);\n  i++;"},
 {tag:"Arrays", code:"const nums = [1, 2, 3];\nconsole.log(nums.length());",
  o:["length é propriedade, não método: o certo é nums.length","nums precisa ser let","O array deveria ter 4 itens","length só funciona em strings"],c:0,
  e:"length é uma propriedade. Usar parênteses causa TypeError: nums.length is not a function.",f:"nums.length"},
 {tag:"Escopo", code:"function calcular() {\n  let resultado = 42;\n}\ncalcular();\nconsole.log(resultado);",
  o:["calcular deveria receber parâmetro","42 não pode ser guardado em let","resultado existe só dentro da função (erro de escopo)","Falta chamar calcular duas vezes"],c:2,
  e:"let tem escopo de bloco. Fora da função, resultado não existe (ReferenceError). Retorne o valor com return.",f:"return resultado;  // e use: const r = calcular();"},
 {tag:"Arrays", code:"const nums = [1, 2, 3];\nconst dobro = nums.forEach(n => n * 2);\nconsole.log(dobro);",
  o:["n * 2 é inválido","forEach não retorna um novo array, dobro fica undefined","nums deveria ser objeto","Falta return dentro de console.log"],c:1,
  e:"forEach só percorre e devolve undefined. Para criar um novo array transformado, use map.",f:"nums.map(n => n * 2)"},
 {tag:"Números", code:"if (0.1 + 0.2 === 0.3) {\n  console.log(\"Igual!\");\n} else {\n  console.log(\"Diferente!\");\n}\n// esperado: Igual!",
  o:["O else está no lugar errado","=== não funciona com números","Números decimais em ponto flutuante têm imprecisão: 0.1 + 0.2 dá 0.30000000000000004","0.3 deveria ser string"],c:2,
  e:"Decimais binários são imprecisos. Compare com tolerância: Math.abs(x - y) < Number.EPSILON.",f:"Math.abs((0.1 + 0.2) - 0.3) < Number.EPSILON"},
 {tag:"Recursão", code:"function fatorial(n) {\n  return n * fatorial(n - 1);\n}\nconsole.log(fatorial(5));",
  o:["n * ... não é permitido","fatorial não pode chamar a si mesma","Falta o parâmetro padrão","Falta o caso base: a recursão nunca para (estouro de pilha)"],c:3,
  e:"Toda recursão precisa de um caso base. Aqui, nunca chega a parar e dá RangeError.",f:"if (n <= 1) return 1;"},
 {tag:"Comparações", code:"const x = Number(\"abc\");\nif (x === NaN) {\n  console.log(\"Não é um número\");\n}",
  o:["NaN nunca é igual a nada, nem a si mesmo; use Number.isNaN(x)","Number não converte strings","O if deveria usar ==","x precisa ser let"],c:0,
  e:"NaN === NaN é false. A forma correta de checar é Number.isNaN(x).",f:"if (Number.isNaN(x)) {"},
 {tag:"Assíncrono", code:"async function carregar() {\n  const resp = fetch(\"/api/dados\");\n  const dados = await resp.json();\n  console.log(dados);\n}",
  o:["json() não existe","Falta await no fetch: resp é uma Promise, não a resposta","async não pode usar await","console.log deveria vir antes"],c:1,
  e:"fetch retorna uma Promise. Sem await, resp.json não existe nela e dá erro.",f:"const resp = await fetch(\"/api/dados\");"},
 {tag:"Strings", code:"const nome = \"Ana\";\nnome[0] = \"E\";\nconsole.log(nome); // esperado: Eva?",
  o:["Falta usar const","Strings são imutáveis: não dá para trocar um caractere pelo índice","Índices começam em 1","nome precisa ser array"],c:1,
  e:"Strings são imutáveis em JS. A atribuição é ignorada. Crie uma nova string, por exemplo \"E\" + nome.slice(1).",f:"const novo = \"E\" + nome.slice(1);"}
,
 {tag:"Closures", code:"for (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 100);\n}\n// esperado: 0, 1, 2",
  o:["var tem escopo de função: todos os callbacks enxergam o mesmo i, que vale 3 no final","O tempo 100 está em segundos e não em milissegundos","Arrow functions não conseguem acessar variáveis do for","setTimeout não pode ser usado dentro de laços"],c:0,
  e:"Com var existe uma única variável i para todo o laço. Quando os callbacks rodam, i já vale 3, então imprime 3, 3, 3. Com let cada volta cria o seu próprio i.",f:"for (let i = 0; i < 3; i++) {"},
 {tag:"Objetos", code:"const original = { nome: \"Ana\", nota: 7 };\nconst copia = original;\ncopia.nota = 10;\nconsole.log(original.nota); // esperado: 7",
  o:["const impede alterar propriedades","Objetos não podem ter propriedades numéricas","A atribuição copia só a referência: original e copia são o mesmo objeto","console.log deveria receber copia"],c:2,
  e:"Atribuir um objeto a outra variável não duplica o objeto, só copia a referência. Para uma cópia rasa, use o spread.",f:"const copia = { ...original };"},
 {tag:"this", code:"const aluno = {\n  nome: \"Ana\",\n  saudar() {\n    return \"Oi, \" + this.nome;\n  }\n};\nconst fn = aluno.saudar;\nconsole.log(fn()); // esperado: Oi, Ana",
  o:["Métodos de objeto não podem usar return","Ao extrair o método, ele perde o this e não aponta mais para aluno","nome deveria ser declarada com let","Falta chamar aluno.nome() com parênteses"],c:1,
  e:"Chamar fn() solta o método do objeto, então this deixa de ser aluno. Use bind ou chame aluno.saudar() direto.",f:"const fn = aluno.saudar.bind(aluno);"},
 {tag:"Ordenação", code:"const idades = [10, 9, 1, 100];\nidades.sort();\nconsole.log(idades); // esperado: [1, 9, 10, 100]",
  o:["sort não altera o array original","O array precisa ser const para ordenar","Faltou passar o array como argumento do sort","Sem comparador, sort ordena como texto: o resultado é [1, 10, 100, 9]"],c:3,
  e:"Por padrão sort converte os itens para string e compara letra por letra. Para números, passe uma função comparadora.",f:"idades.sort((a, b) => a - b);"},
 {tag:"Carrinho", code:"const itens = [{ preco: 10 }, { preco: 20 }];\nconst total = itens.reduce((soma, item) => soma + item.preco);\nconsole.log(total); // esperado: 30",
  o:["item.preco não existe em objetos","reduce só funciona com strings","Sem valor inicial, soma começa como o primeiro objeto e vira texto: \"[object Object]20\"","A função deveria usar multiplicação"],c:2,
  e:"Sem o segundo argumento, o acumulador começa no primeiro elemento (um objeto). O + então concatena texto. Informe o valor inicial 0.",f:"itens.reduce((soma, item) => soma + item.preco, 0);"},
 {tag:"Assíncrono", code:"async function salvarTodos(ids) {\n  ids.forEach(async (id) => {\n    await salvar(id);\n  });\n  console.log(\"Tudo salvo!\");\n}",
  o:["forEach não espera as promises: a mensagem aparece antes dos salvamentos terminarem","async não pode ser usada em arrow functions","salvar deveria ser uma variável let","console.log precisa de await"],c:0,
  e:"forEach ignora o retorno das callbacks async, então a função segue em frente sem esperar. Use for...of com await ou Promise.all.",f:"await Promise.all(ids.map((id) => salvar(id)));"}
,
 {tag:"Strings", code:"const nome = \"Ana\";\nconsole.log(\"Olá, ${nome}!\"); // esperado: Olá, Ana!",
  o:["Aspas duplas não interpolam variáveis: é preciso usar crases (template string)","Falta declarar nome com let","console.log não imprime textos","O símbolo $ não existe em JavaScript"],c:0,
  e:"A interpolação com ${} só funciona dentro de crases. Com aspas, o texto sai literal.",f:"console.log(`Olá, ${nome}!`);"},
 {tag:"Sintaxe", code:"function ola() {\n  console.log(\"oi\");\n\nola();",
  o:["console.log deveria vir depois da chamada","Falta fechar a chave } da função (SyntaxError)","Funções não podem ter nome curto","Falta return na função"],c:1,
  e:"Toda chave aberta precisa ser fechada. Sem a } o código nem executa: SyntaxError.",f:"function ola() {\n  console.log(\"oi\");\n}"},
 {tag:"Variáveis", code:"let total = 5;\nconsole.log(Total);",
  o:["let não pode guardar números","console.log só aceita strings","total precisa de ponto e vírgula","JavaScript diferencia maiúsculas de minúsculas: Total não existe"],c:3,
  e:"Total e total são nomes diferentes. Usar Total gera ReferenceError.",f:"console.log(total);"},
 {tag:"Variáveis", code:"let x = 10;\nlet x = 20;\nconsole.log(x);",
  o:["let não pode ser declarada duas vezes com o mesmo nome no mesmo escopo","20 é um valor inválido","console.log não imprime let","Falta usar const na segunda linha"],c:0,
  e:"Redeclarar com let gera SyntaxError. Para mudar o valor, basta atribuir sem a palavra let.",f:"x = 20;"},
 {tag:"Arrays", code:"const pares = [1, 2, 3, 4].filter((n) => {\n  n % 2 === 0;\n});\nconsole.log(pares); // esperado: [2, 4]",
  o:["filter só funciona com strings","Com chaves é preciso usar return; sem ele o filtro recebe undefined e retorna []","n % 2 calcula o quociente","pares deveria ser let"],c:1,
  e:"Arrow function com chaves não retorna nada sozinha. Sem return, todo item é descartado.",f:"filter((n) => n % 2 === 0)"},
 {tag:"Condicionais", code:"const dia = 1;\nswitch (dia) {\n  case 1:\n    console.log(\"Segunda\");\n  case 2:\n    console.log(\"Terça\");\n}\n// esperado: só Segunda",

function hl(src){

  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const w = m[4], cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "n" : w ? (/^(const|let|var|function|async|this)$/.test(w) ? "d" : /^(true|false|null|undefined|NaN)$/.test(w) ? "n" : "k") : m[5] ? "f" : "o";

}

      const keep = $("fMove").checked && ACC.cur === null && (S.att || S.xp) ? S : null;
      ACC.cur = u; saveAcc(); loadS();
      if (keep) S = JSON.parse(JSON.stringify(keep));
    } else {
      const a = ACC.users[u];
      if (!a || (await hashPw(p, a.salt)) !== a.hash) return acMsg("Usuário ou senha incorretos.");
      ACC.cur = u; saveAcc(); loadS();
    }
    $("fPass").value = ""; $("fPass2").value = "";
    save(); cloudAccPush();
    await cloudBind();
    accUI();
  } finally { $("acGo").disabled = false; }
}
async function logout(){
  ACC.cur = null; saveAcc(); loadS();
  await cloudBind(); accUI();
}
function accUI(){
  const inn = !!ACC.cur, on = !!cloud.ref;
  $("acOut").classList.toggle("hide", inn); $("acIn").classList.toggle("hide", !inn);
  if (!inn) setMode(acMode);
  const nm = ACC.cur || "";
  $("nAcc").textContent = inn ? "👤 " + nm : "👤 Conta";
  $("acName").innerHTML = '<span class="av">' + esc(nm.charAt(0).toUpperCase()) + '</span>' + esc(nm);
  $("acSt").textContent = !on ? "💾 Neste aparelho" : cloud.st === "err" ? "⚠️ Falha ao sincronizar" : "☁️ Sincronizado";
  $("acInfo").textContent = on ? "Seu progresso fica salvo nesta conta." : "Seu progresso fica salvo nesta conta, neste aparelho (no navegador).";
  
  $("rkT").style.display = on ? "" : "none";
  rkUI();
}
$("acTabs").onclick = e => { const b = e.target.closest(".tab"); if (b) setMode(b.dataset.m); };
$("acGo").onclick = acSubmit;
["fUser", "fPass", "fPass2"].forEach(id => { $(id).onkeydown = e => { if (e.key === "Enter") acSubmit(); }; });
$("acOutBtn").onclick = logout;
$("acDel").onclick = async () => {
  if (!delArmed){ delArmed = true; $("acDel").textContent = "Clique de novo para excluir (apaga o progresso)"; setTimeout(() => { delArmed = false; $("acDel").textContent = "Excluir conta"; }, 3500); return; }
  delArmed = false; $("acDel").textContent = "Excluir conta";
  const u = ACC.cur;
  if (cloud.id) { cloud.db.collection("data/users/" + cloud.id).doc("p_" + u).delete().catch(() => {}); }
  delete ACC.users[u]; try { localStorage.removeItem(keyFor(u)); } catch (e) {}
  cloudAccPush(); await logout();
};
async function rkUI(){
  const box = $("rkList");
  if (!cloud.ref){ box.innerHTML = ""; return; }
  const rows = cloud.rank;
  if (!rows.length){ box.innerHTML = '<p class="sub">Ninguém no ranking ainda. Marque a opção acima para ser o primeiro!</p>'; return; }
  let ps = {};
  try { ps = await cloud.user.profiles(rows.map(r => r.id)); } catch (e) {}
  box.innerHTML = rows.map((r, k) => '<div class="rk' + (r.id === cloud.id ? ' me' : '') + '"><span>' + (["🥇","🥈","🥉"][k] || (k + 1) + "º") + '</span><b>' + esc(r.nick || "Dev anônimo") + '</b><small>Nv ' + lvlOf(r.xp || 0) + ' · ' + (r.xp || 0) + ' XP</small></div>').join("");
}
if ($("acRank")) $("acRank").onchange = async e => {
  S.rk = e.target.checked; save();
  if (!S.rk && cloud.ref) { try { await cloud.db.collection("ranking").doc(cloud.id).delete(); } catch (x) {} }
};
$("nAcc").onclick = () => { show("account"); accUI(); };
accUI();
cloudInit();
$("tabs").onclick = e => { const b = e.target.closest(".tab"); if (b){ filter = b.dataset.f; board(); } };
$("list").onclick = e => { const r = e.target.closest(".row"); if (r) play(+r.dataset.i); };
$("reset").onclick = () => {
  if (!resetArmed){ resetArmed = true; $("reset").textContent = "Clique de novo para confirmar"; setTimeout(() => { resetArmed = false; $("reset").textContent = "Zerar progresso"; }, 3000); return; }
  resetArmed = false; $("reset").textContent = "Zerar progresso";
  S = {xp:0, p:{}, streak:0, att:0, hit:0, l:{}}; save(); board();
};
board();
</script>
</body>
